[project]
name = "django-pyas2"
version = "0.1.0"
description = "Django PyAS2 Server for Cargoo"
requires-python = ">=3.13"
dependencies = [
    "aiofiles==24.1.0",
    "django>=5.2.7",
    "httpx==0.28.1",
    "psutil==6.1.0",
    "pyas2lib @ file:///${PROJECT_ROOT}/requirements/pyas2-lib-cargoo-async.zip",
    # "pyas2lib==1.4.3",
    "requests==2.25.1",
    "setuptools>=80.9.0",
]

[dependency-groups]
test = [
    "black==24.10.0",
    "django-environ==0.11.2",
    "pylama==8.4.1",
    "pylint==3.3.1",
    "pytest==8.3.3",
    "pytest-asyncio>=1.2.0",
    "pytest-black>=0.6.0",
    "pytest-cov==5.0.0",
    "pytest-django==4.9.0",
    "pytest-mock==3.14.0",
]

[tool.pylama]
format = "pep8"
skip = "venv/*,.tox/*,*/tests/*,setup.py,*/migrations/*"
linters = "pycodestyle,pyflakes,pylint,pep8"
ignore = "D203,D212,E231,C0330,R0912,R0914,W1202,R1702,C0114,C0302"

[tool.pylama.pycodestyle]
max_line_length = 100

[tool.pylama.pylint]
max_line_length = 100
ignore = "E1101,R0902,R0903,W1203,C0103,C0302,C0209,R0913,R0915,W0612,R1705,R0201,W0613"

[tool.pylama.pydocstyle]
convention = "numpy"
ignore = "D202"

[tool.pylama.pep8]
max_line_length = 100
