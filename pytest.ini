[pytest]
DJANGO_SETTINGS_MODULE=example.settings
asyncio_mode=auto
asyncio_default_fixture_loop_scope=function
# Async tests should be run separately from sync tests due to SQLite limitations
# Run sync tests: pytest -m "not asyncio"
# Run async tests: pytest -m asyncio
# Run all tests: pytest (may have database lock errors with SQLite)
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')